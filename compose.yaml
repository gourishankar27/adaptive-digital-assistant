services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ada
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ada
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - ada_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ada -d ada"]
      interval: 5s
      timeout: 5s
      retries: 12
volumes:
  ada_pgdata:
